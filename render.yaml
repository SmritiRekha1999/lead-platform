# Render blueprint for the backend API.
# In the Render dashboard: New > Blueprint, point it at this repo.
# You must set MONGODB_URI and JWT_SECRET as environment variables.
services:
  - type: web
    name: lead-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
